name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs these tests first

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile stackcheck/__init__.py stackcheck/__main__.py stackcheck.py
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python stackcheck.py --help

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t stackcheck .
      - name: Start and check it answers
        run: |
          docker run -d --name stackcheck -p 127.0.0.1:8080:8080 stackcheck
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/
      - name: Container logs
        if: always()
        run: docker logs stackcheck || true
